services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      - fleet-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fleet
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    
  frontend:
    build: ../fleet-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  fleet-data: